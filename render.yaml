services:
  - type: web
    name: jobguard-xai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -c "import nltk; [nltk.download(p, quiet=True) for p in ['punkt', 'punkt_tab', 'stopwords', 'wordnet', 'omw-1.4', 'averaged_perceptron_tagger', 'averaged_perceptron_tagger_eng']]"
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
